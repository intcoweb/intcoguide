<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b2a45" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>安徽英科医疗导航</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/style.css?v=20260917-21" />
  <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- ======================= 地图 Tab ======================= -->
    <section class="page page-map" id="page-map">
      <!-- 当前基地名：点开可切换基地 -->
      <div class="map-base-bar" id="mapCampusWrap">
        <button class="map-base-btn" id="mapCampusBtn" type="button" aria-label="切换基地"></button>
      </div>

      <div class="map-search-entry">
        <input class="map-search-input" id="mapSearchInput" placeholder="搜索地点" autocomplete="off" />
        <button class="map-search-btn" id="mapSearchBtn" type="button">搜索</button>
      </div>

      <!-- 分类栏（无路线时） -->
      <div class="map-control" id="mapControl">
        <div class="map-categories" id="mapCategories"></div>
      </div>

      <!-- 出行方式（有路线时） -->
      <div class="map-modes" id="mapModes">
        <div class="mode" data-mode="walking">步行</div>
        <div class="mode" data-mode="bicycling">骑行</div>
        <div class="mode" data-mode="driving">驾车</div>
      </div>

      <!-- 地图容器 -->
      <div id="leafletMap"></div>

      <!-- 地图右侧按钮 -->
      <div class="map-right-tools">
        <div class="location" id="mapRestoreBtn" title="还原">
          <img src="assets/images/restore.png" alt="还原" />
        </div>
        <div class="location" id="mapLocationBtn" title="定位">
          <img src="assets/images/location.png" alt="定位" />
        </div>
        <button class="location orientation-permission" id="mapOrientationBtn" title="朝向权限申请" type="button" aria-label="朝向权限申请">
          <svg class="orientation-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9.1" fill="none" stroke="currentColor" stroke-width="1.7" />
            <path d="M16.1 7.9 13.3 13.3 7.9 16.1 10.7 10.7z" fill="currentColor" />
            <path d="M7.9 16.1 10.7 10.7 13.3 13.3z" fill="currentColor" opacity=".38" />
          </svg>
        </button>
        <button class="map-layer-toggle" id="mapLayerToggle" title="切换厂区示意图/真实地图"><span class="lt-line">真实</span><span class="lt-line">地图</span></button>
      </div>

      <!-- 底部按钮 -->
      <div class="map-bottom hidden" id="mapBottomBtn"></div>

      <!-- iOS 方向权限引导：iOS 要求「页面内的一次手势」才能申请设备朝向，
           首次进入时给一个显眼入口，用户不必去找右侧的小按钮 -->
      <button class="map-orient-hint" id="mapOrientHint" type="button">
        <svg class="map-orient-hint-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M16 8 13.4 13.4 8 16 10.6 10.6z" fill="currentColor" />
        </svg>
        <span class="map-orient-hint-text">轻触屏幕，开启方向指引</span>
        <span class="map-orient-hint-go">开启</span>
      </button>
    </section>

    <!-- ======================= 基地介绍 Tab ======================= -->
    <section class="page page-site" id="page-site">
      <!-- 厂区 Hero：原「首页」顶部区块，现置于基地介绍页最上方 -->
      <div class="home-hero">
        <div class="hero-bg"></div>
        <span class="hero-orb orb-a"></span>
        <span class="hero-orb orb-b"></span>
        <span class="hero-orb orb-c"></span>
        <div class="hero-shine"></div>
        <div class="hero-top">
          <span class="hero-eyebrow"><i></i>INTCO MEDICAL · 智慧园区</span>
          <div class="hero-campus" id="siteCampusWrap">
            <button class="picker" id="siteCampusBtn" type="button"></button>
          </div>
        </div>
        <h1 class="home-school-name" id="heroSchoolName"></h1>
        <div class="home-english" id="heroEnglish"></div>
        <div class="hero-tags" id="heroTags"></div>
        <div class="hero-quote" id="heroMotto"></div>
      </div>

      <div class="site-body">
        <div class="site-left" id="siteLeft"></div>
        <div class="site-right">
          <div class="site-title">
            <img id="siteTitleIcon" src="assets/images/tag.png" alt="" />
            <span class="site-title-name" id="siteTitleText"></span>
            <span class="site-title-count" id="siteTitleCount"></span>
          </div>
          <div class="site-content" id="siteContent"></div>
        </div>
      </div>
    </section>

    <!-- ======================= 子页面（覆盖层） ======================= -->
    <section class="subpage" id="page-search">
      <div class="sub-nav">
        <button class="back" data-back>‹</button>
        <span class="sub-title">搜索地点</span>
      </div>
      <div class="search-root" id="searchRoot"></div>
      <div class="search-history" id="searchHistory"></div>
      <div class="search-result" id="searchResult"></div>
    </section>

    <section class="subpage" id="page-instruction">
      <div class="sub-nav">
        <button class="back" data-back>‹</button>
        <span class="sub-title">使用说明</span>
      </div>
      <div class="instruction-body" id="instructionBody"></div>
    </section>

    <section class="subpage" id="page-introduction">
      <div class="sub-nav">
        <button class="back" data-back>‹</button>
        <span class="sub-title">厂区简介</span>
      </div>
      <div class="introduction-body" id="introductionBody"></div>
    </section>

    <section class="subpage" id="page-pano">
      <div class="sub-nav">
        <button class="back" data-back>‹</button>
        <span class="sub-title">全景地图</span>
      </div>
      <div class="pano-body" id="panoBody"></div>
    </section>

    <!-- 底部 TabBar -->
    <nav class="tabbar" id="tabbar">
      <a class="tab-item" data-route="#/map">
        <img class="tab-icon" src="assets/images/tabbar/icon_map.png" data-alt="assets/images/tabbar/icon_map_HL.png" alt="地图讲解" /><span>地图讲解</span>
      </a>
      <!-- 「青州地图」tab 已移除：基地切换改由地图页顶部胶囊 / 基地介绍页右上角承担 -->
      <a class="tab-item" data-route="#/site">
        <img class="tab-icon" src="assets/images/tabbar/icon_collection.png" data-alt="assets/images/tabbar/icon_collection_HL.png" alt="基地介绍" /><span>基地介绍</span>
      </a>
    </nav>

    <!-- 弹窗 -->
    <div class="modal-mask" id="modalMask">
      <div class="modal" id="modalBox">
        <div class="modal-header">
          <span id="modalTitle"></span>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
      </div>
    </div>

    <!-- 轻提示 toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
    <script src="js/data.js?v=20260917-05"></script>
    <script src="assets/audio/guides/manifest.js?v=20260916-1"></script>
    <script src="js/app.js?v=20260917-29"></script>
</body>
</html>
